# Configuración de Base de Datos (MySQL - base de datos real con datos)
spring.application.name=inventario
spring.datasource.url=jdbc:mysql://localhost:3306/sapam_inventario?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configuración JWT
sgia.jwt.secret=sgia-secret-key-2026-very-secure-change-in-production
sgia.jwt.expiration=3600000

# Configuración de la aplicación
server.port=8080
